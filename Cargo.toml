[workspace]
members = [
    "crates/metal-api-core",
    "crates/metal-api-ipc",
    "crates/metal-api-vulkan",
    "crates/metal-api-native",
    "examples/metal-smoke",
]
exclude = ["integration/reims"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
license = "LGPL-3.0-or-later"
repository = "https://github.com/Hi-Jiajun/metal-api-emulator"

[workspace.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
libc = "0.2"
metal2vulkan = { git = "https://github.com/steelbrain/metal2vulkan.git", rev = "43c46ac8a24adf1a6e872b8a52c706ec9614fad0" }
spirv = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
