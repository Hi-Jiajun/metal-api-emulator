            > /tmp/native-evidence/present-selftest.json \
            2>> "$log" || status=$?
          cat /tmp/native-evidence/present-selftest.json >> "$log"
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "present selftest: FAIL (oracle exited $status)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          python3 - <<'PY' 2>&1 | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'conformance')
          from run_native import NativeRunError, validate_present_selftest
          report = json.loads(Path('/tmp/native-evidence/present-selftest.json').read_text())
          try:
              observed = validate_present_selftest(report)
          except NativeRunError as error:
              print('present_selftest: FAIL (' + str(error) + ')')
              raise SystemExit(1)
          print('present_selftest: PASS (' + observed[0] + ')')
          PY
      # The one-device heap check (`research/docs/25` §6 Step 7a). It mirrors
      # the render and present self-tests: the same `--probe` eligibility gate,
      # the same SKIP-not-PASS discipline for an ineligible host, and a report
      # whose one writeback and two allocations must read the reviewed copy_word
      # result rather than the `ffffffff` sentinel the write buffer was preset
      # with. The byte comparison is `conformance/run_native.py::
      # validate_heap_selftest`, exercised by `conformance/test_run_native.py`,
      # not an inline re-write.
      - name: Run native heap self-test when a Metal device is eligible
        run: |
          set -o pipefail
          mkdir -p /tmp/native-evidence
          log=/tmp/native-evidence/heap-selftest.log
          : > "$log"
          probe_rc=0
          /tmp/native-oracle --probe > /tmp/native-evidence/heap-selftest-probe.json \
            2>> "$log" || probe_rc=$?
          if [ "$probe_rc" -ne 0 ]; then
            echo "heap selftest: FAIL (probe exited $probe_rc)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit "$probe_rc"
          fi
          eligibility=0
          python3 - <<'PY' >> "$log" 2>&1 || eligibility=$?
          import json
          from pathlib import Path
          path = Path('/tmp/native-evidence/heap-selftest-probe.json')
          try:
              probe = json.loads(path.read_text())
          except Exception as error:
              print('heap selftest: probe unreadable: ' + str(error))
              raise SystemExit(2)
          if probe.get('kind') != 'metal-device-probe':
              print('heap selftest: unexpected probe kind: ' + repr(probe.get('kind')))
              raise SystemExit(2)
          print('heap selftest probe: ' + json.dumps(probe, sort_keys=True))
          raise SystemExit(0 if probe['eligible'] else 1)
          PY
          if [ "$eligibility" -eq 1 ]; then
            echo "heap selftest: SKIP (no Metal device)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit 0
          fi
          if [ "$eligibility" -ne 0 ]; then
            echo "heap selftest: FAIL (unusable probe, exit $eligibility)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit "$eligibility"
          fi
          echo "heap selftest: device eligible; running the reviewed MTLHeap copy_word check" >> "$log"
          status=0
          (cd conformance && /tmp/native-oracle --heap-selftest) \
            > /tmp/native-evidence/heap-selftest.json \
            2>> "$log" || status=$?
          cat /tmp/native-evidence/heap-selftest.json >> "$log"
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "heap selftest: FAIL (oracle exited $status)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          python3 - <<'PY' 2>&1 | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'conformance')
          from run_native import NativeRunError, validate_heap_selftest
          report = json.loads(Path('/tmp/native-evidence/heap-selftest.json').read_text())
          try:
              observed = validate_heap_selftest(report)
          except NativeRunError as error:
              print('heap_selftest: FAIL (' + str(error) + ')')
              raise SystemExit(1)
          print('heap_selftest: PASS (' + observed + ')')
          PY
      # The one-device MRT check (`conformance/RENDER-CAPTURE.md` §10). It
      # mirrors the heap self-test above: the same `--probe` eligibility gate,
      # the same SKIP-not-PASS discipline for an ineligible host, and a report
      # whose two writebacks and two allocations must read the reviewed dual
      # module's per-location texels rather than the `fefefefe` clear sentinel.
      # The byte comparison is `conformance/run_native.py::validate_mrt_selftest`,
      # exercised by `conformance/test_run_native.py`, not an inline re-write.
      - name: Run native MRT self-test when a Metal device is eligible
        run: |
          set -o pipefail
          mkdir -p /tmp/native-evidence
          log=/tmp/native-evidence/mrt-selftest.log
          : > "$log"
          probe_rc=0
          /tmp/native-oracle --probe > /tmp/native-evidence/mrt-selftest-probe.json \
            2>> "$log" || probe_rc=$?
          if [ "$probe_rc" -ne 0 ]; then
            echo "mrt selftest: FAIL (probe exited $probe_rc)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit "$probe_rc"
          fi
          eligibility=0
          python3 - <<'PY' >> "$log" 2>&1 || eligibility=$?
          import json
          from pathlib import Path
          path = Path('/tmp/native-evidence/mrt-selftest-probe.json')
          try:
              probe = json.loads(path.read_text())
          except Exception as error:
              print('mrt selftest: probe unreadable: ' + str(error))
              raise SystemExit(2)
          if probe.get('kind') != 'metal-device-probe':
              print('mrt selftest: unexpected probe kind: ' + repr(probe.get('kind')))
              raise SystemExit(2)
          print('mrt selftest probe: ' + json.dumps(probe, sort_keys=True))
          raise SystemExit(0 if probe['eligible'] else 1)
          PY
          if [ "$eligibility" -eq 1 ]; then
            echo "mrt selftest: SKIP (no Metal device)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit 0
          fi
          if [ "$eligibility" -ne 0 ]; then
            echo "mrt selftest: FAIL (unusable probe, exit $eligibility)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit "$eligibility"
          fi
          echo "mrt selftest: device eligible; running the reviewed dual-output quad" >> "$log"
          status=0
          (cd conformance && /tmp/native-oracle --mrt-selftest) \
            > /tmp/native-evidence/mrt-selftest.json \
            2>> "$log" || status=$?
          cat /tmp/native-evidence/mrt-selftest.json >> "$log"
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "mrt selftest: FAIL (oracle exited $status)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          python3 - <<'PY' 2>&1 | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'conformance')
          from run_native import NativeRunError, validate_mrt_selftest
          report = json.loads(Path('/tmp/native-evidence/mrt-selftest.json').read_text())
          try:
              observed = validate_mrt_selftest(report)
          except NativeRunError as error:
              print('mrt_selftest: FAIL (' + str(error) + ')')
              raise SystemExit(1)
          print('mrt_selftest: PASS (' + report['id'] + ' ' + ' '.join(observed) + ')')
          PY
      # The one-device depth-resolve check (`research/docs/23` §3.3, v57e). It
      # mirrors the neighbouring self-tests' `--probe` eligibility gate and
      # SKIP-not-PASS discipline, then runs the three-filter depth resolve
      # fixture. The oracle's own per-texel stdout lines are the authoritative
      # answer for whether the Apple device executes Min/Max: it exits nonzero
      # unless the stable columns hold (column 0 = 0.5, column 3 = 0.9) and the
      # key column splits min (0.5) from max (0.9), so a device that reduces
      # both filters to one value is a failing step, never a PASS.
      - name: Run native depth-resolve self-test when a Metal device is eligible
        run: |
          set -o pipefail
          mkdir -p /tmp/native-evidence
          log=/tmp/native-evidence/depth-resolve-selftest.log
          : > "$log"
          probe_rc=0
          /tmp/native-oracle --probe > /tmp/native-evidence/depth-resolve-selftest-probe.json \
            2>> "$log" || probe_rc=$?
          if [ "$probe_rc" -ne 0 ]; then
            echo "depth-resolve selftest: FAIL (probe exited $probe_rc)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit "$probe_rc"
          fi
          eligibility=0
          python3 - <<'PY' >> "$log" 2>&1 || eligibility=$?
          import json
          from pathlib import Path
