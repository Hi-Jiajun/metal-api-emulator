          try:
              probe = json.loads(path.read_text())
          except Exception as error:
              print('depth-resolve selftest: probe unreadable: ' + str(error))
              raise SystemExit(2)
          if probe.get('kind') != 'metal-device-probe':
              print('depth-resolve selftest: unexpected probe kind: ' + repr(probe.get('kind')))
              raise SystemExit(2)
          print('depth-resolve selftest probe: ' + json.dumps(probe, sort_keys=True))
          raise SystemExit(0 if probe['eligible'] else 1)
          PY
          if [ "$eligibility" -eq 1 ]; then
            echo "depth-resolve selftest: SKIP (no Metal device)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit 0
          fi
          if [ "$eligibility" -ne 0 ]; then
            echo "depth-resolve selftest: FAIL (unusable probe, exit $eligibility)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            cat "$log"
            exit "$eligibility"
          fi
          echo "depth-resolve selftest: device eligible; running the three-filter depth resolve" >> "$log"
          # The oracle prints the per-texel landings and its own PASS line to
          # stdout; stdout and stderr share the log and the step summary so the
          # answer survives the job even when the step fails on purpose.
          status=0
          (cd conformance && /tmp/native-oracle --depth-resolve-selftest) \
            2>&1 | tee -a "$log" -a "$GITHUB_STEP_SUMMARY" || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "depth-resolve selftest: FAIL (oracle exited $status)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      # The one-device stencil-resolve check (`research/docs/23` §3.3, v59).
      # It mirrors the depth-resolve neighbour's `--probe` eligibility gate and
      # SKIP-not-PASS discipline, then runs the three-pass stencil resolve
      # fixture. The oracle's own per-texel stdout lines are the authoritative
