      # Gate 2's G2-f: the per-API-class A/B parity, derived from the captures
      # the lines above already validated. The classes are declared in
      # `conformance/narrow-class.json`; `narrow_class.py` holds each fixture to
      # its class's covered rules and re-hashes the fixture's own sources, then
      # names the rails of the one fixture set the class claims parity over. It
      # captures nothing, so this step adds no second observation of the same
      # bytes: a class fails here only if the five-rail parity above disagrees
      # with the class's declaration.
      - name: Derive the narrow classes' A/B parity from the same captures
        run: |
          python3 conformance/narrow_class.py --class compute-buffer-narrow \
            --rail native-metal=/tmp/native-evidence/v1/native-metal.json \
            --rail vulkan=/tmp/vulkan-evidence/vulkan-capture.json \
            --rail native-metal-provider=/tmp/native-evidence/rust-provider-v1.json \
            --rail vulkan-objects=/tmp/vulkan-evidence/vulkan-objects-v1.json \
            --rail native-metal-provider-objects=/tmp/native-evidence/metal-objects-v1.json
          python3 conformance/narrow_class.py --class render-narrow \
            --rail native-metal=/tmp/native-evidence/v16/native-metal.json \
            --rail vulkan=/tmp/vulkan-evidence/vulkan-capture-v16.json \
            --rail native-metal-provider=/tmp/native-evidence/rust-provider-v16.json \
            --rail vulkan-objects=/tmp/vulkan-evidence/vulkan-objects-v16.json \
            --rail native-metal-provider-objects=/tmp/native-evidence/metal-objects-v16.json

  reims-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup override set 1.96.0
      - name: Install offline GPU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm spirv-tools libvulkan1 mesa-vulkan-drivers
      - name: Prepare pinned reims sources
        run: python3 integration/reims/prepare.py
      - name: Test optional reims adapter
        run: cargo test --manifest-path integration/reims/Cargo.toml --locked
      - name: Run reims smoke on Lavapipe
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#icds[@]}" -eq 1
          export VK_ICD_FILENAMES="${icds[0]}"
          cargo run --manifest-path integration/reims/Cargo.toml --locked --bin reims-smoke

  windows-cross-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup override set 1.96.0
      - name: Install MinGW-w64 and the Windows target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - name: Build the Windows rail
        run: cargo build --locked --target x86_64-pc-windows-gnu -p metal-smoke --bins
      - name: Clippy the Windows rail
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -p metal-smoke --bins --no-deps -- -D warnings
      - name: Prepare pinned reims sources
        run: python3 integration/reims/prepare.py
      - name: Check the Windows reims adapter
        run: cargo check --locked --target x86_64-pc-windows-gnu --manifest-path integration/reims/Cargo.toml --bin reims-smoke
