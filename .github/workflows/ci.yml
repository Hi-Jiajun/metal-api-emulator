name: Standalone checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.96.0
      - name: Install offline GPU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm spirv-tools libvulkan1 mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s conformance -p 'test_*.py' -v
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Lavapipe smoke
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#icds[@]}" -eq 1
          export VK_ICD_FILENAMES="${icds[0]}"
          cargo run --locked -p metal-smoke -- --executor standalone
          cargo run --locked -p metal-smoke --bin provider-smoke
          mkdir -p /tmp/vulkan-captures
          cargo run --locked -p metal-smoke --bin provider-capture -- --suite conformance/suite.json --output /tmp/vulkan-captures/vulkan-capture.json
          python3 conformance/compare.py --suite conformance/suite.json --check /tmp/vulkan-captures/vulkan-capture.json
          cargo run --locked -p metal-smoke --bin provider-capture -- --suite conformance/suite-v2.json --output /tmp/vulkan-captures/vulkan-capture-v2.json
          python3 conformance/compare.py --suite conformance/suite-v2.json --check /tmp/vulkan-captures/vulkan-capture-v2.json
          cargo run --locked -p metal-smoke --bin provider-capture -- --suite conformance/suite-v3.json --output /tmp/vulkan-captures/vulkan-capture-v3.json
          python3 conformance/compare.py --suite conformance/suite-v3.json --check /tmp/vulkan-captures/vulkan-capture-v3.json
          cargo run --locked -p metal-smoke --bin provider-capture -- --suite conformance/suite-v4.json --output /tmp/vulkan-captures/vulkan-capture-v4.json
          python3 conformance/compare.py --suite conformance/suite-v4.json --check /tmp/vulkan-captures/vulkan-capture-v4.json
          cargo run --locked -p metal-smoke --bin provider-capture -- --suite conformance/suite-v5.json --output /tmp/vulkan-captures/vulkan-capture-v5.json
          python3 conformance/compare.py --suite conformance/suite-v5.json --check /tmp/vulkan-captures/vulkan-capture-v5.json

      - name: Preserve Vulkan report
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-capture
          path: /tmp/vulkan-captures/
          if-no-files-found: error

  native-oracle-build:
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      capture_status: ${{ steps.capture.outputs.capture_status }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup override set 1.96.0
      - name: Check Rust native provider
        run: |
          cargo test --locked -p metal-api-core -p metal-api-native
          cargo clippy --locked -p metal-api-native --all-targets --no-deps -- -D warnings
          cargo build --locked -p metal-smoke --bin provider-capture
      - name: Compile native Metal capture tool
        run: |
          xcrun swiftc -swift-version 5 -warnings-as-errors -framework Foundation -framework Metal -framework CoreGraphics -framework CryptoKit conformance/NativeOracle.swift -o /tmp/native-oracle
      - name: Probe Metal and capture when eligible
        id: capture
        run: |
          python3 conformance/run_native.py --oracle /tmp/native-oracle --suite conformance/suite.json --output-dir /tmp/native-evidence/v1 --source-revision "$GITHUB_SHA"
          python3 conformance/run_native.py --oracle /tmp/native-oracle --suite conformance/suite-v2.json --output-dir /tmp/native-evidence/v2 --source-revision "$GITHUB_SHA"
          python3 conformance/run_native.py --oracle /tmp/native-oracle --suite conformance/suite-v3.json --output-dir /tmp/native-evidence/v3 --source-revision "$GITHUB_SHA"
          python3 conformance/run_native.py --oracle /tmp/native-oracle --suite conformance/suite-v4.json --output-dir /tmp/native-evidence/v4 --source-revision "$GITHUB_SHA"
          python3 conformance/run_native.py --oracle /tmp/native-oracle --suite conformance/suite-v5.json --output-dir /tmp/native-evidence/v5 --source-revision "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          statuses = [json.loads(Path('/tmp/native-evidence', version, 'status.json').read_text()) for version in ('v1', 'v2', 'v3', 'v4', 'v5')]
          combined = 'captured' if all(s['capture_status'] == 'captured' for s in statuses) else 'unavailable'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('capture_status=' + combined + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for status in statuses:
                  summary.write(status['suite'] + ': **' + status['capture_status'] + '**. ' + status['reason'] + '\n\n')
          PY
      - name: Capture Rust Metal provider through shared interface
        if: steps.capture.outputs.capture_status == 'captured'
        run: |
          target/debug/provider-capture --backend native-metal-provider --suite conformance/suite.json --output /tmp/native-evidence/rust-provider-v1.json
          target/debug/provider-capture --backend native-metal-provider --suite conformance/suite-v2.json --output /tmp/native-evidence/rust-provider-v2.json
          python3 conformance/compare.py --suite conformance/suite.json --check /tmp/native-evidence/rust-provider-v1.json
          python3 conformance/compare.py --suite conformance/suite-v2.json --check /tmp/native-evidence/rust-provider-v2.json
          target/debug/provider-capture --backend native-metal-provider --suite conformance/suite-v3.json --output /tmp/native-evidence/rust-provider-v3.json
          python3 conformance/compare.py --suite conformance/suite-v3.json --check /tmp/native-evidence/rust-provider-v3.json
          target/debug/provider-capture --backend native-metal-provider --suite conformance/suite-v4.json --output /tmp/native-evidence/rust-provider-v4.json
          python3 conformance/compare.py --suite conformance/suite-v4.json --check /tmp/native-evidence/rust-provider-v4.json
          target/debug/provider-capture --backend native-metal-provider --suite conformance/suite-v5.json --output /tmp/native-evidence/rust-provider-v5.json
          python3 conformance/compare.py --suite conformance/suite-v5.json --check /tmp/native-evidence/rust-provider-v5.json
      - name: Preserve native probe, status and any completed capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence
          path: /tmp/native-evidence/
          if-no-files-found: warn

  compare-captures:
    needs: [standalone, native-oracle-build]
    if: needs.native-oracle-build.outputs.capture_status == 'captured'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-capture
          path: /tmp/vulkan-evidence
      - uses: actions/download-artifact@v4
        with:
          name: native-evidence
          path: /tmp/native-evidence
      - name: Compare observed native and Vulkan results
        run: |
          python3 conformance/compare.py --suite conformance/suite.json --native /tmp/native-evidence/v1/native-metal.json --vulkan /tmp/vulkan-evidence/vulkan-capture.json --metal-provider /tmp/native-evidence/rust-provider-v1.json
          python3 conformance/compare.py --suite conformance/suite-v2.json --native /tmp/native-evidence/v2/native-metal.json --vulkan /tmp/vulkan-evidence/vulkan-capture-v2.json --metal-provider /tmp/native-evidence/rust-provider-v2.json
          python3 conformance/compare.py --suite conformance/suite-v3.json --native /tmp/native-evidence/v3/native-metal.json --vulkan /tmp/vulkan-evidence/vulkan-capture-v3.json --metal-provider /tmp/native-evidence/rust-provider-v3.json
          python3 conformance/compare.py --suite conformance/suite-v4.json --native /tmp/native-evidence/v4/native-metal.json --vulkan /tmp/vulkan-evidence/vulkan-capture-v4.json --metal-provider /tmp/native-evidence/rust-provider-v4.json
          python3 conformance/compare.py --suite conformance/suite-v5.json --native /tmp/native-evidence/v5/native-metal.json --vulkan /tmp/vulkan-evidence/vulkan-capture-v5.json --metal-provider /tmp/native-evidence/rust-provider-v5.json
