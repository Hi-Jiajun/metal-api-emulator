          if [ "$status" -ne 0 ]; then
            echo "stencil-resolve selftest: FAIL (oracle exited $status)" | tee -a "$log" -a "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Preserve native probe, status and any completed capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence
          path: /tmp/native-evidence/
          if-no-files-found: warn

